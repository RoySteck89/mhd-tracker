<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHD-Tracker</title>
    <!-- Verknüpfung zur CSS-Datei -->
    <link rel="stylesheet" href="css/style.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <!-- html5-qrcode Bibliothek für den Kamera-Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <div class="container">
        <div id="status-bar" class="status-bar">Nicht verbunden</div>
        <h1>MHD-Tracker</h1>

        <!-- Aktivierungs-Bereich -->
        <section id="auth-section">
            <h3>Filiale / Aktivierung</h3>
            <p>Bitte geben Sie Ihren Aktivierungsschlüssel ein, um fortzufahren.</p>
            <form id="auth-form">
                <input type="text" id="activation-key-input" placeholder="Aktivierungsschlüssel (z.B. kik-filiale-01)" required>
                <button type="submit">Aktivieren</button>
            </form>
        </section>

        <!-- Hauptbereich (nach Freischaltung) -->
        <section id="tracker-section" class="hidden">
            <div class="actions">
                <h3>Neuen Artikel erfassen</h3>
                <form id="mhd-form">
                    <div class="scanner-row">
                        <input type="text" id="article-barcode" placeholder="Barcode scannen / eingeben" required>
                        <button type="button" id="scan-btn">📷 Scannen</button>
                    </div>
                    
                    <!-- Kamera-Vorschaubild -->
                    <div id="reader" class="hidden"></div>

                    <input type="text" id="article-name" placeholder="Artikelbezeichnung (z.B. Frischmilch)" required>
                    <input type="date" id="article-mhd" required>
                    <button type="submit">Artikel speichern</button>
                </form>
            </div>

            <h2>Fällige Artikel (MHD)</h2>
            <div id="mhd-list">
                <!-- Hier werden die Artikel dynamisch aus Supabase geladen -->
            </div>
        </section>
    </div>

    <!-- Skripte -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker Registrierung -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registriert:', reg.scope))
                    .catch(err => console.log('Service Worker Fehler:', err));
            });
        }
    </script>
</body>
</html>
