<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHD-Tracker - Rollen-System</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- HTML5 QR Code Scanner CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<div class="container">
    <!-- SUPER-ADMIN ANSICHTSWECHSLER -->
    <div id="adminSimulatorBar" class="admin-bar hidden">
        <span>👑 Admin-Simulator:</span>
        <div>
            <button onclick="switchView('admin')" id="btn-admin" class="active">Admin</button>
            <button onclick="switchView('bezirksleiter')" id="btn-bezirksleiter">Bezirksleitung</button>
            <button onclick="switchView('teamleiter')" id="btn-teamleiter">Teamleiter</button>
            <button onclick="switchView('mitarbeiter')" id="btn-mitarbeiter">Mitarbeiter</button>
        </div>
    </div>

    <h1>MHD-Tracker</h1>
    <div id="statusBadge">Nicht angemeldet</div>

    <!-- ANSICHT 1: SCHRITT 1 - KEY PRÜFEN -->
    <div id="viewSetupKey" class="hidden">
        <h2>Gerät aktivieren</h2>
        <p>Schritt 1 von 2: Aktivierungsschlüssel eingeben</p>
        <input type="text" id="setupKey" placeholder="z.B. MHD-Dietmannsried-4821">
        <button onclick="verifyKeyStep1()">Key prüfen</button>
    </div>

    <!-- ANSICHT 1: SCHRITT 2 - ROLLE SPEZIFISCHE DATEN -->
    <div id="viewSetupDetails" class="hidden">
        <h2>Gerät aktivieren</h2>
        <p id="roleInfoText" style="color: var(--primary-color); font-weight: bold; margin-bottom: 15px;"></p>
        
        <div id="extraFieldContainer" class="hidden">
            <input type="text" id="setupExtraName" placeholder="">
        </div>

        <input type="text" id="setupName" placeholder="Dein Name">
        <input type="text" id="setupKasse" placeholder="Kassennummer">
        <input type="password" id="setupPin" placeholder="4-stellige Kassen-PIN" maxlength="4">
        <button onclick="registerDeviceStep2()">Aktivieren & Starten</button>
    </div>

    <!-- ANSICHT 2: SCHNELL-LOGIN -->
    <div id="viewLogin" class="hidden">
        <h2>Schicht-Login</h2>
        <p>Anmeldung für dieses Gerät:</p>
        <input type="text" id="loginKasse" placeholder="Kassennummer">
        <input type="password" id="loginPin" placeholder="Kassen-PIN" maxlength="4">
        <button onclick="loginWithPin()">Einloggen</button>
        <p style="text-align: center; margin-top: 15px;"><a href="#" onclick="resetDevice()" style="color: #dc3545; font-size: 12px; text-decoration: none;">Gerät zurücksetzen / Neu aktivieren</a></p>
    </div>

    <!-- ANSICHT 3: DASHBOARDS -->
    <div id="viewDashboard" class="hidden">
        <h2 id="dashTitle">Dashboard</h2>
        <div id="dashContent">
            <!-- Dynamischer Inhalt -->
        </div>
        <button onclick="logoutDevice()" style="background-color: #dc3545; margin-top: 20px;">Abmelden</button>
    </div>

    <!-- EINSTELLUNGEN (DESIGN & SCHRIFT-SCHIEBER) - JETZT UNTEN -->
    <div id="userPreferencesCard" class="card" style="margin-top: 30px; border-left-color: var(--border-color);">
        <h3>⚙️ Persönliche Einstellungen (für diesen Nutzer)</h3>
        
        <div style="margin-top: 10px;">
            <label for="themeSelect">🎨 Design-Auswahl:</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="kik">KiK Classic (Rot)</option>
                <option value="dark">Modern Dark (Dunkel)</option>
                <option value="clean">Clean Light (Hell)</option>
                <option value="contrast">High Contrast (Kontrast)</option>
            </select>
        </div>

        <div style="margin-top: 15px;">
            <label for="fontSizeRange">🔤 Schriftgröße anpassen: <span id="fontSizeVal">16px</span></label>
            <input type="range" id="fontSizeRange" min="12" max="24" value="16" step="1" oninput="changeFontSize(this.value)" style="width: 100%; cursor: pointer; accent-color: var(--primary-color);">
        </div>
    </div>
</div>

<!-- Skripte -->
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
