<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHD-Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Html5-Qrcode Scanner CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="theme-glitter">

    <div class="container">
        <h1>MHD-Tracker</h1>
        <div id="statusBadge">Status: Wird geladen...</div>

        <!-- SIMULATOR BAR (FÜR ADMIN/TEST) -->
        <div class="admin-bar">
            <strong>👑 Admin-Simulator:</strong>
            <div>
                <button onclick="setSimulatedRole('admin')" class="active">Admin</button>
                <button onclick="setSimulatedRole('bezirksleitung')">Bezirksleitung</button>
                <button onclick="setSimulatedRole('teamleiter')">Teamleiter</button>
                <button onclick="setSimulatedRole('mitarbeiter')">Mitarbeiter</button>
            </div>
        </div>

        <!-- VIEW 1: ACTIVATION KEY SETUP -->
        <div id="viewSetupKey" class="hidden">
            <h2>App-Aktivierung</h2>
            <p>Bitte gib deinen erhaltenen Aktivierungs-Key ein:</p>
            <input type="text" id="activationKeyInput" placeholder="z. B. KIK-TL-9823">
            <button onclick="verifyActivationKey()">Key überprüfen</button>
        </div>

        <!-- VIEW 2: DETAILS SETUP -->
        <div id="viewSetupDetails" class="hidden">
            <h2>Mitarbeiter Profil anlegen</h2>
            <p id="keyRoleInfo"></p>
            <label for="setupName">Name:</label>
            <input type="text" id="setupName" placeholder="Dein Name">
            
            <label for="setupPin">Kassen-PIN (4-stellig):</label>
            <input type="password" id="setupPin" maxlength="4" placeholder="****">
            
            <button onclick="completeRegistration()">Registrierung abschließen</button>
        </div>

        <!-- VIEW 3: LOGIN -->
        <div id="viewLogin" class="hidden">
            <h2>Anmeldung</h2>
            <label for="loginPin">Kassen-PIN:</label>
            <input type="password" id="loginPin" maxlength="4" placeholder="****">
            <button onclick="loginWithPin()">Anmelden</button>
        </div>

        <!-- VIEW 4: DASHBOARD -->
        <div id="viewDashboard" class="hidden">
            <div id="dashContent">
                <!-- Dynamischer Inhalt je nach Rolle -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
