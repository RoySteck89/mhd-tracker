<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHD-Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f5d4">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Schlanker QuaggaJS Scanner für schnelles Auto-Scanning -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
</head>
<body class="theme-glitter">

    <div class="container">
        <h1>MHD-Tracker</h1>
        <div id="statusBadge">Status: Wird geladen...</div>

        <!-- SIMULATOR BAR -->
        <div class="admin-bar" id="adminBar" style="display:none;">
            <strong>👑 Admin-Simulator:</strong>
            <div>
                <button onclick="setSimulatedRole('admin')" class="active">Admin</button>
                <button onclick="setSimulatedRole('bezirksleitung')">Bezirksleitung</button>
                <button onclick="setSimulatedRole('teamleiter')">Teamleiter</button>
                <button onclick="setSimulatedRole('mitarbeiter')">Mitarbeiter</button>
            </div>
        </div>

        <!-- VIEW 1: ACTIVATION KEY SETUP -->
        <div id="viewSetupKey" class="hidden">
            <h2>App-Aktivierung</h2>
            <p>Bitte gib deinen erhaltenen Aktivierungs-Key ein:</p>
            <input type="text" id="activationKeyInput" placeholder="z. B. ADMIN-MASTER-KEY oder Key">
            <button onclick="verifyAndActivateKey()">Key überprüfen</button>
        </div>

        <!-- VIEW 2: DASHBOARD -->
        <div id="viewDashboard" class="hidden">
            <div id="dashContent"></div>
        </div>
    </div>

    <!-- App Logik -->
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
